# The Falcon documentation site, built by GitHub Pages from this folder (see README.md).
title: Falcon
description: Java readers and writers for HDF5, Zarr, and OME-Zarr, with minimal dependencies and no native code.
repository: ebremer/falcon
url: https://ebremer.github.io
baseurl: /falcon

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
highlighter: rouge

# GitHub Pages runs this plugin by default; naming it keeps a local build the same. It turns links to .md
# files into links to their pages, so the same links work on github.com and on the site.
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false

exclude:
  - README.md

defaults:
  - scope:
      path: ""
    values:
      layout: default
