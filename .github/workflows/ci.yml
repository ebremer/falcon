name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: build & test (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The test fixtures (.h5 files, AEC/szip vectors) are committed and hermetic, so the build needs
      # only JDK 25 and Maven — no HDF5, h5py, or native libraries.
      - name: Build and test
        run: mvn -B --no-transfer-progress verify
